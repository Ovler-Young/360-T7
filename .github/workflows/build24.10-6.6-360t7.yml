name: Build ImmortalWrt 25.12.2 360T7 (experimental)

on:
  workflow_dispatch:
permissions:
  contents: write 
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.2
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 2512-360t7.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: 2512-diy-part2.sh
  RELEASE_FILE: release.txt  
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: America/New_York

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache OpenWrt dl directory
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/dl
        key: openwrt-dl-${{ hashFiles('diy-part1.sh', '2512-diy-part2.sh', '2512-360t7.config') }}
        restore-keys: |
          openwrt-dl-

    - name: Cache toolchain and ccache
      continue-on-error: true
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        toolchain: 'true'
        skip: 'true'
        prefix: '${{ github.workspace }}/openwrt'
        mixkey: 'mediatek-filogic-2512'

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
         cd openwrt
         ./scripts/feeds update -a


    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a 
         
    - name: Load custom configuration
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        # Save explicit package intent before Kconfig can discard unavailable symbols.
        sed -n 's/^CONFIG_PACKAGE_\(.*\)=y$/\1/p' .config | \
          grep -vE '^(dnsmasq_full_|TAR_)' > required-packages.txt
        test -s required-packages.txt
        make defconfig
        missing=0
        for pkg in $(cat required-packages.txt); do
          grep -qx "CONFIG_PACKAGE_${pkg}=y" .config || { echo "Required package missing: $pkg" >&2; missing=1; }
        done
        test "$missing" -eq 0
        ! grep -qx 'CONFIG_PACKAGE_librespeed-cli-rust=y' .config || { echo 'Unexpected Rust LibreSpeed package' >&2; exit 1; }
        ! grep -qx 'CONFIG_PACKAGE_kmod-mt_wifi=y' .config || { echo 'Unexpected proprietary MTK Wi-Fi driver' >&2; exit 1; }
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        ls dl/ | sort > /tmp/dl_needed.txt

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        test -s staging_dir/target-aarch64_cortex-a53_musl/root-mediatek/etc/uci-defaults/90-adguardhome-legacy-config || { echo 'Missing AdGuardHome legacy migration script in image root' >&2; exit 1; }
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Clean unused dl packages
      continue-on-error: true
      if: steps.compile.outputs.status == 'success'
      run: |
        comm -23 <(ls /workdir/openwrt/dl/ | sort) /tmp/dl_needed.txt | xargs -I{} rm -rf "/workdir/openwrt/dl/{}"


    - name: Check space usage
      continue-on-error: true
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      continue-on-error: true
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        for image in *qihoo_360t7-squashfs-sysupgrade.itb; do
          test -s "$image" || { echo "Missing or empty official-layout qihoo_360t7 sysupgrade FIT image" >&2; exit 1; }
          grep -Fq " $image" sha256sums || { echo "Missing image SHA-256 entry" >&2; exit 1; }
        done
        manifest=$(find . -maxdepth 1 -name '*filogic.manifest' -print -quit)
        test -s "$manifest" || { echo 'Missing nonempty target package manifest' >&2; exit 1; }
        for pkg in $(cat "$GITHUB_WORKSPACE/openwrt/required-packages.txt"); do
          grep -q "^${pkg} " "$manifest" || { echo "Missing package in manifest: $pkg" >&2; exit 1; }
        done
        sha256sum -c sha256sums --ignore-missing
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      continue-on-error: false
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      continue-on-error: true
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch "${RELEASE_FILE}"

        if [ "${UPLOAD_GOFILE}" = "true" ] && [ -n "${{ steps.gofile.outputs.url }}" ]; then
          echo "{U+0001F517} [GoFile](${{ steps.gofile.outputs.url }})" >> "${RELEASE_FILE}"
        fi

        echo "status=success" >> $GITHUB_OUTPUT
    
    - name: Upload firmware to release
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: ${{ env.RELEASE_FILE }}
        files: ${{ env.FIRMWARE }}/*

    - name: Remove old Releases
      continue-on-error: true
      uses: dev-drprasad/delete-older-releases@master
      if: steps.tag.outputs.status == 'success'
      with:
        keep_latest: 12
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
